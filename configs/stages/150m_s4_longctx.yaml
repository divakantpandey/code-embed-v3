# EXAMPLE starting values; tuned hyperparameters for released models are private.
# Stage 4: short long-context phase so whole files (2k-8k tokens) embed well.
name: ce3-150m-s4
model: configs/models/modernbert-150m.yaml
init_from: runs/150m/s3/final
data_dir: data/mix_v1_mined
dev_suite: data/mix_v1_mined
output_dir: runs/150m/s4
hub_repo: divakantpandey/code-embed-v3-150m-s4
loss: cached_mnrl
batch_size: 256
learning_rate: 1.0e-5
max_steps: 2000
warmup_ratio: 0.05
temperature: 0.02
max_seq_length: 8192
gradient_checkpointing: true
save_steps: 500
eval_steps: 500
