# Stage 3: distil teacher rankings (`ce3 label data/mix_v1_mined --teacher Qwen/Qwen3-Reranker-4B ...`,
# or the trained 0.6B sibling). Calibrate teacher_temperature to the teacher's score spread first;
# see DistillKLDivLoss docs on softmax underflow.
name: ce3-150m-s3
model: configs/models/modernbert-150m.yaml
init_from: runs/150m/s2/final
data_dir: data/mix_v1_labelled
dev_suite: data/mix_v1_labelled
output_dir: runs/150m/s3
hub_repo: divakantpandey/code-embed-v3-150m-s3
loss: distill_kl
batch_size: 128
learning_rate: 2.0e-5
num_train_epochs: 1
warmup_ratio: 0.05
temperature: 0.02
student_temperature: 0.02
teacher_temperature: 1.0
contrastive_weight: 0.1
max_seq_length: 1024
save_steps: 500
eval_steps: 500
