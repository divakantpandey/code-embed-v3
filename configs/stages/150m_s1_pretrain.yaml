# Stage 1: large-batch weakly-supervised contrastive pretraining on pairs.
# Starting points, not tuned values: sweep lr and temperature in short ablations first.
name: ce3-150m-s1
model: configs/models/modernbert-150m.yaml
data_dir: data/mix_v1
dev_suite: data/mix_v1
output_dir: runs/150m/s1
hub_repo: divakantpandey/code-embed-v3-150m-s1
loss: cached_mnrl
batch_size: 16384   # global; GradCache, so memory is set by the auto-sized mini batch
learning_rate: 1.0e-4
num_train_epochs: 1
warmup_ratio: 0.05
temperature: 0.02
directions: [query_to_doc, doc_to_query]
multi_dataset_batch_sampler: proportional
max_seq_length: 512
save_steps: 50
eval_steps: 100
