# EXAMPLE starting values; tuned hyperparameters for released models are private.
# Option A: GTE-ModernBERT -> hard-negative fine-tune on a family-balanced subset, no stage 1.
# Justification: default `make mine-gte` uses 25k rows/source with 4 mined negatives (~250k rows total)
# and `max_seq_length: 512` to cut GPU cost ~16x vs 250k x 7 at 1024 tokens, because GTE-ModernBERT-base
# is already pretrained. Override with `MINE_ROWS=250000 MINE_NEGS=7` only if dev-suite ablations justify it.
name: ce3-150m-ft
model: configs/models/gte-modernbert-150m.yaml
data_dir: data/mix_v1_gte_mined
dev_suite: data/mix_v1_gte_mined
output_dir: runs/150m/ft
hub_repo: divakantpandey/code-embed-v3-150m-ft
loss: cached_mnrl
batch_size: 512
learning_rate: 2.0e-5
num_train_epochs: 1
warmup_ratio: 0.05
temperature: 0.02
hardness_mode: hard_negatives
hardness_strength: 5.0
max_seq_length: 512
save_steps: 250
eval_steps: 250
